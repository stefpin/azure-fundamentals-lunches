<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-label="A blue and gold batik-style pattern">
  <defs>
    <pattern id="kawung" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="#12355b"/>
      <ellipse cx="30" cy="15" rx="9" ry="14" fill="#e8a200"/>
      <ellipse cx="30" cy="45" rx="9" ry="14" fill="#e8a200"/>
      <ellipse cx="15" cy="30" rx="14" ry="9" fill="#f5c451"/>
      <ellipse cx="45" cy="30" rx="14" ry="9" fill="#f5c451"/>
      <circle cx="30" cy="30" r="4" fill="#12355b"/>
      <circle cx="0" cy="0" r="5" fill="#f4f6fa"/>
      <circle cx="60" cy="0" r="5" fill="#f4f6fa"/>
      <circle cx="0" cy="60" r="5" fill="#f4f6fa"/>
      <circle cx="60" cy="60" r="5" fill="#f4f6fa"/>
    </pattern>
  </defs>
  <rect width="300" height="200" rx="14" fill="url(#kawung)"/>
  <rect x="10" y="150" width="200" height="38" rx="8" fill="#ffffff" opacity="0.9"/>
  <text x="22" y="175" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#12355b">Nusantara Retail · batik</text>
</svg>
