# Lab 29 · a small pod that calls the storefront service from inside the cluster for five minutes.
# It uses the Azure Linux busybox image from Microsoft Artifact Registry (wget and sh only).
apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: nusa
  labels:
    app: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: mcr.microsoft.com/azurelinux/busybox:1.36
      command: ["/bin/sh", "-c"]
      args:
        - |
          echo "Sending requests to http://storefront for 5 minutes..."
          end=$(( $(date +%s) + 300 ))
          for i in 1 2 3 4; do
            ( while [ "$(date +%s)" -lt "$end" ]; do wget -q -O /dev/null http://storefront; done ) &
          done
          wait
          echo "Done."
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          cpu: 500m
          memory: 64Mi
