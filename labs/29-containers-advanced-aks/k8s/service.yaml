# Lab 29 · a public entry point: AKS programs the Azure Standard Load Balancer
# and adds a public IP address in the node resource group (MC_...).
apiVersion: v1
kind: Service
metadata:
  name: storefront
  namespace: nusa
  labels:
    app: storefront
spec:
  type: LoadBalancer
  selector:
    app: storefront
  ports:
    - name: http
      port: 80
      targetPort: http
