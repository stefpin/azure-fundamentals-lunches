<title>Signing in… · Sedang masuk…</title>
<!-- Lunch Tutor sign-in redirect page (hand-written, not generated by tools/build_site.py).
     The Microsoft sign-in pop-up returns here; the MSAL redirect bridge hands the response
     back to the course page that opened it. Register this page's address as the SPA redirect URI. -->
<style>
body{margin:0;min-block-size:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fbf7f1;color:#16203a}
@media (prefers-color-scheme:dark){body{background:#0b1120;color:#ecf1fb}}
p{margin:0;padding:24px;font-size:1.05rem;text-align:center}
</style>
</head>
<body>
<p>Signing in… · <span lang="id">Sedang masuk…</span></p>
<script src="../assets/vendor/msal-redirect-bridge.min.js"></script>
<script>
(function () {
  try {
    var bridge = window.msalRedirectBridge;
    var done = bridge.broadcastResponseToMainFrame();
    if (done && typeof done.catch === 'function') done.catch(function () { /* the course page reports sign-in errors */ });
  } catch (e) { /* bridge missing: the course page times out and shows a friendly error */ }
})();
</script>
</body>
</html>
